{% extends 'layout.html' %}
{% load i18n %}
{% block title %}Baremos{% endblock %}
{% block content %}
<div class="container mt-5">
    <h3>Charts Testing</h3>
    <div id="grafico" style="width: 900px; height: 500px;"></div>
</div>
<script>
    const data = {{ datos_json|safe }};
    const acc_go = data.acc_go;

    const trace = {
          x: acc_go,
          type: 'histogram',
          marker: {
            color: 'skyblue',
            line: {
                color: 'grey',
                width: 1
            }
          },
          xbins: {
            start: 0,
            end: 100,
            size: 0.5
          }
    };

    const layout = {
      title: '{% trans 'Histograma' %}',
      xaxis: { title: '{% trans 'Precisión' %} (%)' },
      yaxis: { title: '{% trans 'Frecuencia' %}' },
      shapes: [
        {
          type: 'line',
          x0: 99.5,
          x1: 99.5,
          y0: 0,
          y1: 1,
          yref: 'paper',  // para que y1 = 1 signifique "hasta arriba del gráfico"
          line: {
            color: 'red',
            width: 2,
            dash: 'dashdot'
          }
        }
      ],
      annotations: [
        {
          x: 99.5,
          y: 1,
          yref: 'paper',
          text: '{% trans 'Aquí estás tu' %}: 99.5',
          showarrow: false,
          font: {
            color: 'red',
            size: 12
          },
          xanchor: 'left'
        }
      ]
    };

    Plotly.newPlot('grafico', [trace], layout);
</script>
<PRE style="color:red;">
    {{ datos_json }}
</PRE>
{% endblock %}
