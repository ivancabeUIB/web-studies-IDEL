{% extends 'layout.html' %}
{% load i18n %}
{% block title %}OpenAT{% endblock %}
{% block content %}
<div id="main_content" class="container mt-5">
    <!-- About Section -->
    <div>
        <h3>{% trans 'Info Tareas' %}</h3>
        <p>{{ task_info.name }}</p>
        <p>{{ task_info.description }}</p>
        <img src="{{ task_info.photo.url }}" alt="" width="700px" height="200px"/>
        <a href="{{ task_info.url_to_jatos }}">{% trans 'Ir al estudio' %}</a>
    </div>
    <!-- End page content -->
</div>
<style>
    #recommended_projects {
        margin-top: 80px;
    }
</style>
{% endblock %}
