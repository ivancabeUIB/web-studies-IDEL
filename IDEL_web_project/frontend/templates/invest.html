{% extends 'layout.html' %}
{% load i18n %}
{% block title %}OpenAT{% endblock %}
{% block content %}
<div id="main_content" class="container mt-5">
    <!-- About Section -->
    <div>
        <h3>{% trans 'Info Project' %}</h3>
        <p>{{ invest_info.name }}</p>
        <p>{{ invest_info.description }}</p>
        {% if invest_info.photo %}
        <img src="{{ invest_info.photo.url }}" alt="" width="700px" height="200px"/>
        {% endif %}
    </div>
    <!-- End page content -->
</div>
<style>
    #recommended_projects {
        margin-top: 80px;
    }
</style>
{% endblock %}
